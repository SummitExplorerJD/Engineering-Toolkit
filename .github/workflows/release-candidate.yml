name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version such as v0.1.0-rc.1, or v0.1.0 for the final candidate
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        shell: pwsh
        run: go test ./...

      - name: Run static analysis
        shell: pwsh
        run: go vet ./...

      - name: Run vulnerability analysis
        shell: pwsh
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Exercise the TUF staging rehearsal
        shell: pwsh
        run: go test -v ./internal/update/tufclient -run '^TestStagingRehearsal$' -count=1

      - name: Build release candidate
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload candidate artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engkit-${{ inputs.version }}
          path: dist/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke ${{ matrix.os }}/${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-2025
            extension: .exe
          - os: windows
            arch: arm64
            runner: windows-11-arm
            extension: .exe
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            extension: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            extension: ""
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            extension: ""
          - os: darwin
            arch: arm64
            runner: macos-15
            extension: ""
    steps:
      - name: Check out verification script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: engkit-${{ inputs.version }}
          path: candidate

      - name: Run native smoke test
        shell: pwsh
        run: |
          $binary = Join-Path candidate "engkit-$env:RELEASE_VERSION-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          ./scripts/test-release-binary.ps1 -BinaryPath $binary -Version $env:RELEASE_VERSION

      - name: Qualify v0.3.0 command and fallback paths
        if: startsWith(inputs.version, 'v0.3.0')
        shell: pwsh
        run: |
          $binary = Join-Path candidate "engkit-$env:RELEASE_VERSION-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          $evidence = Join-Path $env:RUNNER_TEMP "v030-qualification"
          ./scripts/test-v030-release-binary.ps1 -BinaryPath $binary -Version $env:RELEASE_VERSION -OutputDirectory $evidence

      - name: Upload v0.3.0 qualification evidence
        if: startsWith(inputs.version, 'v0.3.0')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v030-qualification-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/v030-qualification/v030-release-qualification.json
          if-no-files-found: error
          retention-days: 14

      - name: Qualify v0.4.0 context and MCP paths
        if: startsWith(inputs.version, 'v0.4.0')
        shell: pwsh
        run: |
          $binary = Join-Path candidate "engkit-$env:RELEASE_VERSION-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          $evidence = Join-Path $env:RUNNER_TEMP "v040-qualification"
          ./scripts/test-v040-release-binary.ps1 -BinaryPath $binary -Version $env:RELEASE_VERSION -OutputDirectory $evidence

      - name: Upload v0.4.0 qualification evidence
        if: startsWith(inputs.version, 'v0.4.0')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v040-qualification-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/v040-qualification/v040-release-qualification.json
          if-no-files-found: error
          retention-days: 14

      - name: Test installation transaction
        shell: pwsh
        run: ./scripts/test-installer.ps1 -CandidateDirectory candidate -Version $env:RELEASE_VERSION -OS ${{ matrix.os }} -Arch ${{ matrix.arch }}

      - name: Run provider conformance unit tests
        shell: pwsh
        run: go test -count=1 ./internal/providersync ./internal/providersyncexec

      - name: Exercise provider conformance with the native binary
        shell: pwsh
        run: |
          $binary = Join-Path candidate "engkit-$env:RELEASE_VERSION-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          $evidence = Join-Path $env:RUNNER_TEMP "provider-conformance"
          ./scripts/test-provider-conformance.ps1 -BinaryPath $binary -OutputDirectory $evidence -OS ${{ matrix.os }} -Arch ${{ matrix.arch }}

      - name: Upload provider conformance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-conformance-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/provider-conformance/
          if-no-files-found: error
          retention-days: 14

  provider-conformance:
    name: Compare provider conformance
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out comparison script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download provider conformance evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          pattern: provider-conformance-${{ inputs.version }}-*
          path: evidence

      - name: Compare portable provider evidence
        shell: pwsh
        run: ./scripts/compare-provider-conformance.ps1 -EvidenceDirectory evidence
