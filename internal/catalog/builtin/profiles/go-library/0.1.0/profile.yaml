schema_version: engkit.project-profile/v1alpha1
id: go-library
version: 0.1.0
description: Adds a provider-neutral Engineering Toolkit workspace to a reusable Go library.
compatibility:
  ecosystems:
    - go
  modes:
    - new-project
    - existing-workspace
variables:
  - name: project_name
    type: string
    description: Human-readable project name.
    required: true
    min_length: 1
    max_length: 80
skills:
  - template_id: project-guide
    template_version: 0.1.0
    bindings:
      project_name:
        variable: project_name
workspace_directories:
  - .agents/context
  - .agents/conventions
  - .agents/skills
  - .agents/workflows
workspace_assets:
  - source: files/AGENTS.md.tmpl
    destination: AGENTS.md
    kind: agent-instructions
    media_type: text
    source_sha256: sha256:2e64148180db80465626d5fd60a2b50db85602242b6bd2b151fcc8207cb1182d
  - source: files/go.md.tmpl
    destination: .agents/conventions/go.md
    kind: convention
    media_type: text
    source_sha256: sha256:560d27f992e7bacd8e3fe5da379110dd4816ef83c54bfdc4422b54d6da266898
  - source: files/project-overview.md.tmpl
    destination: .agents/context/project-overview.md
    kind: context
    media_type: text
    source_sha256: sha256:2c6f5814109c9261bc870c51a42bd17c5afbfd7b5ccb9c04bdb19c8e1190641a
  - source: files/verify.md.tmpl
    destination: .agents/workflows/verify.md
    kind: workflow
    media_type: text
    source_sha256: sha256:a86d39ff255dfb37c054f70f04f1ddc8daa0a898d851621fccc62292a366b1a7
source_layout:
  policy: preserve
integration_requests: []
